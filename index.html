<meta charset="UTF-8">

<title>Claims Tracker — Mann-Grandstaff VAMC FY2026</title>
<style>

  :root{--navy:#0f2444;--navy2:#1a3560;--teal:#1a7fa8;--teal2:#22a8db;--gold:#c9922a;--green:#1a7a4a;--green-bg:#e8f7ee;--red:#c0392b;--red-bg:#fdecea;--amber:#d97706;--amber-bg:#fef3c7;--bg:#f0f4f9;--card:#fff;--border:#dde3ed;--text:#1a2640;--muted:#6b7a99;--stripe:#f7f9fc;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  .header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:100;}
  .header-left h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em;}
  .header-left p{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px;font-family:'DM Mono',monospace;}
  .tabbar{background:var(--navy);display:flex;gap:2px;padding:0 24px;border-bottom:2px solid var(--teal);overflow-x:auto;}
  .tab{padding:9px 18px;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;}
  .tab:hover{color:rgba(255,255,255,.85);}
  .tab.active{color:var(--teal2);border-bottom-color:var(--teal2);}
  .month-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:6px;align-items:center;overflow-x:auto;}
  .month-bar label{font-size:11px;font-weight:600;color:var(--muted);margin-right:4px;white-space:nowrap;}
  .mbtn{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .mbtn:hover{border-color:var(--teal);color:var(--teal);}
  .mbtn.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .mbtn.ytd{background:var(--navy);border-color:var(--navy);color:#fff;}
  .mbtn.ytd.active{background:var(--gold);border-color:var(--gold);}
  .content{padding:16px 24px;max-width:1400px;margin:0 auto;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--teal);}
  .stat-card.gold::before{background:var(--gold);}
  .stat-card.green::before{background:var(--green);}
  .stat-card.navy::before{background:var(--navy);}
  .stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .stat-val{font-size:26px;font-weight:700;color:var(--navy);line-height:1.1;margin:4px 0 2px;font-family:'DM Mono',monospace;}
  .stat-sub{font-size:10px;color:var(--muted);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
  .card-title{padding:10px 16px;font-size:12px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--stripe);}
  table{width:100%;border-collapse:collapse;}
  th{padding:8px 12px;text-align:center;font-size:10px;font-weight:700;color:#fff;background:var(--navy);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
  th.left{text-align:left;}
  td{padding:7px 12px;text-align:center;border-bottom:1px solid var(--border);font-size:12px;color:var(--text);}
  td.left{text-align:left;font-weight:600;}
  tr:last-child td{border-bottom:none;}
  tr:nth-child(even) td{background:var(--stripe);}
  tr.total-row td{background:var(--navy)!important;color:#fff!important;font-weight:700;}
  .num{font-family:'DM Mono',monospace;}
  .dash{color:var(--border);}
  .badge-met{background:var(--green-bg);color:var(--green);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-miss{background:var(--red-bg);color:var(--red);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-warn{background:var(--amber-bg);color:var(--amber);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-ref{background:#f0f4f9;color:var(--muted);padding:2px 8px;border-radius:12px;font-size:11px;}
  .medal{font-size:16px;}
  .perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .perf-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .perf-head{padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .perf-body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .perf-section h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;}
  .perf-section ul{padding-left:14px;}
  .perf-section li{font-size:11px;line-height:1.7;color:var(--text);}
  .perf-stats{display:flex;gap:8px;padding:8px 14px;background:var(--stripe);border-top:1px solid var(--border);flex-wrap:wrap;}
  .ps{text-align:center;min-width:70px;}
  .ps-val{font-size:16px;font-weight:700;color:var(--navy);font-family:'DM Mono',monospace;}
  .ps-lbl{font-size:9px;color:var(--muted);font-weight:600;}
  .panel{display:none;}
  .panel.active{display:block;}
  .prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;}
  .prog-fill{height:100%;border-radius:3px;background:var(--teal);transition:width .4s;}
</style>
</head>

function pct(a,b){return b>0?Math.round(a/b*100):0;}

var currentMonth="YTD",currentTab="summary";
function switchTab(tab,el){currentTab=tab;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});document.getElementById('panel-'+tab).classList.add('active');renderPanel(tab);}
function setMonth(mo,el){currentMonth=mo;document.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');renderPanel(currentTab);}
function renderPanel(tab){if(tab==='summary')renderSummary();if(tab==='weekly')renderWeekly();if(tab==='leaderboard')renderLeaderboard();if(tab==='threshold')renderThreshold();if(tab==='trips')renderTrips();if(tab==='notes')renderNotes();}

function renderSummary(){
  var isYTD=currentMonth==='YTD',months=isYTD?MONTHS:[currentMonth],label=isYTD?'YTD FY2026':currentMonth;
  var grandTotal=CORE.reduce(function(s,n){return s+(isYTD?ytdTotal(n):modTotal(currentMonth,n));},0);
  var top=CORE.reduce(function(b,n){return(isYTD?ytdTotal(n):modTotal(currentMonth,n))>(isYTD?ytdTotal(b):modTotal(currentMonth,b))?n:b;},CORE[0]);
  var otherTotal=months.reduce(function(s,m){return s+((DATA[m]&&DATA[m].others_m)||[]).reduce(function(a,b){return a+b;},0);},0);
  var teamTotal=grandTotal+otherTotal;
  var moCols=isYTD?MONTHS.map(function(m){return'<th>'+m+'</th>';}).join(''):'';
  var rows=CORE.map(function(n){var t=isYTD?ytdTotal(n):modTotal(currentMonth,n),avg=isYTD?ytdAvgDay(n):avgDay(currentMonth,n);return'<tr><td class="left">'+n+'</td><td class="num">'+fmt(t)+'</td><td class="num">'+avg+'</td>'+(isYTD?MONTHS.map(function(m){return'<td class="num">'+fmt(modTotal(m,n))+'</td>';}).join(''):'')+'</tr>';}).join('');
  document.getElementById('panel-summary').innerHTML='<div class="stat-row"><div class="stat-card"><div class="stat-label">Team Total ('+label+')</div><div class="stat-val num">'+teamTotal.toLocaleString()+'</div><div class="stat-sub">All staff combined</div></div><div class="stat-card gold"><div class="stat-label">Core Staff Total</div><div class="stat-val num">'+grandTotal.toLocaleString()+'</div><div class="stat-sub">'+CORE.length+' tracked employees</div></div><div class="stat-card green"><div class="stat-label">Top Producer</div><div class="stat-val" style="font-size:16px;padding-top:4px">'+top.split(' ')[0]+'</div><div class="stat-sub">'+(isYTD?ytdTotal(top):modTotal(currentMonth,top)).toLocaleString()+' claims</div></div><div class="stat-card navy"><div class="stat-label">Other Staff</div><div class="stat-val num">'+otherTotal.toLocaleString()+'</div><div class="stat-sub">Non-core contributors</div></div></div><div class="card"><div class="card-title">📋 Claims Modified — '+label+'</div><table><thead><tr><th class="left">Staff Member</th><th>Total</th><th>Avg/Day</th>'+moCols+'</tr></thead><tbody>'+rows+'<tr class="total-row"><td class="left">GRAND TOTAL (incl. other staff)</td><td class="num">'+teamTotal.toLocaleString()+'</td><td>—</td>'+(isYTD?MONTHS.map(function(m){return'<td class="num">'+(CORE.reduce(function(s,n){return s+modTotal(m,n);},0)+((DATA[m]&&DATA[m].others_m)||[]).reduce(function(a,b){return a+b;},0)).toLocaleString()+'</td>';}).join(''):'')+'</tr></tbody></table></div>';
}

function renderWeekly(){
  var isYTD=currentMonth==='YTD',months=isYTD?MONTHS:[currentMonth],html='';
  months.forEach(function(mo){var d=DATA[mo];if(!d)return;html+='<div class="card" style="margin-bottom:16px"><div class="card-title">📅 '+mo+' — Weekly Breakdown</div><table><thead><tr><th class="left">Staff Member</th>'+d.weeks.map(function(w){return'<th>'+w+'</th>';}).join('')+'<th>Total</th><th>Avg/Day</th></tr></thead><tbody>'+CORE.map(function(n){var vals=d.modified[n]||[],t=vals.reduce(function(a,b){return a+b;},0);return'<tr><td class="left">'+n+'</td>'+vals.map(function(v){return'<td class="num">'+fmt(v)+'</td>';}).join('')+'<td class="num" style="font-weight:700;color:var(--navy)">'+fmt(t)+'</td><td class="num">'+avgDay(mo,n)+'</td></tr>';}).join('')+'<tr><td class="left" style="color:var(--muted);font-style:italic">Other Staff</td>'+d.others_m.map(function(v){return'<td class="num" style="color:var(--muted)">'+fmt(v)+'</td>';}).join('')+'<td class="num" style="color:var(--muted)">'+fmt(d.others_m.reduce(function(a,b){return a+b;},0))+'</td><td>—</td></tr><tr class="total-row"><td class="left">Grand Total</td>'+d.weeks.map(function(_,wi){return'<td class="num">'+(CORE.reduce(function(s,n){return s+((d.modified[n]&&d.modified[n][wi])||0);},0)+d.others_m[wi]).toLocaleString()+'</td>';}).join('')+'<td class="num">'+(CORE.reduce(function(s,n){return s+modTotal(mo,n);},0)+d.others_m.reduce(function(a,b){return a+b;},0)).toLocaleString()+'</td><td>—</td></tr></tbody></table></div>';});
  document.getElementById('panel-weekly').innerHTML=html;
}

function renderLeaderboard(){
  var isYTD=currentMonth==='YTD',medals=['🥇','🥈','🥉'];
  var sorted=CORE.map(function(n){return{name:n,total:isYTD?ytdTotal(n):modTotal(currentMonth,n),avg:isYTD?ytdAvgDay(n):avgDay(currentMonth,n)};}).sort(function(a,b){return b.total-a.total;});
  var rows=sorted.map(function(e,i){return'<tr><td><span class="medal">'+(medals[i]||i+1)+'</span></td><td class="left">'+e.name+'</td><td class="num" style="font-weight:700;font-size:15px;color:var(--navy)">'+(e.total>0?e.total.toLocaleString():'<span class="dash">—</span>')+'</td><td class="num">'+e.avg+'</td><td style="width:180px"><div class="prog-bar"><div class="prog-fill" style="width:'+pct(e.total,sorted[0].total)+'%"></div></div></td>'+MONTHS.map(function(m){return'<td class="num">'+fmt(modTotal(m,e.name))+'</td>';}).join('')+'</tr>';}).join('');
  document.getElementById('panel-leaderboard').innerHTML='<div class="card"><div class="card-title">🏆 '+(isYTD?'YTD':'Monthly')+' Leaderboard — '+currentMonth+'</div><table><thead><tr><th style="width:40px">#</th><th class="left">Staff Member</th><th>Total</th><th>Avg/Day</th><th>Relative</th>'+MONTHS.map(function(m){return'<th>'+m+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function renderThreshold(){
  var rows=CORE.map(function(name){
    var baseMo=BASELINE_MONTH[name]||"Feb 2026",baseVal=modTotal(baseMo,name),stdBase=STD_DAYS[baseMo]||21,dailyRate=baseVal>0?(baseVal/stdBase).toFixed(1):"—";
    var cells='',met=0,total=0;
    TRACK_MONTHS.forEach(function(mo){
      var t=modTotal(mo,name),isPartial=mo===CURRENT_MONTH,isBaseline=mo===baseMo,isPreHire=TRACK_MONTHS.indexOf(mo)<TRACK_MONTHS.indexOf(baseMo);
      var ad=getActiveDays(mo,name),stdMo=STD_DAYS[mo]||21,onLeave=ad>0&&ad<stdMo;
      var needed=baseVal>0?Math.round((baseVal/stdBase)*(ad>0?ad:stdMo)*THRESHOLD):0;
      if(isPreHire){cells+='<td><span class="badge-ref" style="font-size:10px">Pre-hire</span></td>';return;}
      if(isBaseline){cells+='<td class="num"><strong>'+(t>0?t.toLocaleString():'—')+'</strong><br><span style="font-size:9px;color:var(--muted)">baseline · '+stdBase+'d · '+dailyRate+'/day</span></td>';return;}
      if(!baseVal){cells+='<td><span class="badge-ref">—</span></td>';return;}
      var pass=t>=needed;
      if(!isPartial){total++;if(pass)met++;}
      var leaveNote=onLeave?'<br><span style="font-size:9px;color:var(--amber)">📅 '+ad+'/'+stdMo+' days</span>':'<br><span style="font-size:9px;color:var(--muted)">'+ad+'/'+stdMo+' days</span>';
      cells+='<td><span class="'+(pass?'badge-met':isPartial?'badge-warn':'badge-miss')+'">'+(pass?'✅':isPartial?'⏳':'❌')+' '+t.toLocaleString()+'</span><br><span style="font-size:9px;color:var(--'+(pass?'green':isPartial?'amber':'red')+')">need ≥'+needed+(isPartial?' (partial)':'')+'</span>'+leaveNote+'</td>';
    });
    var rate=total>0?Math.round(met/total*100):null;
    var rateBadge=rate===null?'<span class="badge-ref">—</span>':rate===100?'<span class="badge-met">'+rate+'%</span>':rate>=75?'<span class="badge-warn">'+rate+'%</span>':'<span class="badge-miss">'+rate+'%</span>';
    return'<tr><td class="left">'+name+'<br><span style="font-size:10px;color:var(--muted);font-weight:400">baseline: '+baseMo+' = '+baseVal.toLocaleString()+' · '+dailyRate+' claims/day</span></td>'+cells+'<td class="num" style="font-weight:700">'+(total>0?met+'/'+total:'—')+'</td><td>'+rateBadge+'</td></tr>';
  }).join('');
  document.getElementById('panel-threshold').innerHTML='<div class="card" style="margin-bottom:12px"><div class="card-title">ℹ️ How This Works</div><div style="padding:10px 16px;font-size:12px;color:var(--muted);line-height:1.7">Fixed baseline per employee (first full month). Daily rate × days actually worked × 75% = monthly target. Leave days auto-detected and pro-rated. <span style="color:var(--amber)">📅 = fewer than standard days worked.</span> <strong>⏳ '+CURRENT_MONTH+' excluded until month closes.</strong></div></div><div class="card"><div class="card-title">⚠️ 75% Pro-Rated Fixed Baseline Threshold</div><div style="overflow-x:auto"><table><thead><tr><th class="left">Staff Member</th>'+TRACK_MONTHS.map(function(m){return'<th>'+m+(m===CURRENT_MONTH?' ⏳':'')+'</th>';}).join('')+'<th>Met</th><th>Rate</th></tr></thead><tbody>'+rows+'<tr class="total-row"><td class="left">Team Total</td>'+TRACK_MONTHS.map(function(m){return'<td class="num">'+CORE.reduce(function(s,n){return s+modTotal(m,n);},0).toLocaleString()+'</td>';}).join('')+'<td>—</td><td>—</td></tr></tbody></table></div></div>';
}

function renderTrips(){
  var grandTotal=TRIPS_STAFF.reduce(function(s,n){return s+tripsTotal(n);},0);
  var topName=TRIPS_STAFF.reduce(function(b,n){return tripsTotal(n)>tripsTotal(b)?n:b;},TRIPS_STAFF[0]);
  var sorted=TRIPS_STAFF.slice().sort(function(a,b){return tripsTotal(b)-tripsTotal(a);});
  var rows=sorted.map(function(name,ri){var moVals=TRIPS_MONTHS.map(function(m){return(TRIPS_MONTHLY[m]&&TRIPS_MONTHLY[m][name])||0;});var total=tripsTotal(name);return'<tr style="background:'+(ri%2===0?'var(--stripe)':'#fff')+'"><td class="left">'+name+'</td>'+moVals.map(function(v){return'<td class="num">'+(v>0?v.toLocaleString():'<span class="dash">—</span>')+'</td>';}).join('')+'<td class="num" style="font-weight:700;color:var(--navy)">'+(total>0?total.toLocaleString():'<span class="dash">—</span>')+'</td></tr>';}).join('');
  var teamRow='<tr class="total-row"><td class="left">Team Total</td>'+TRIPS_MONTHS.map(function(m){var t=tripsMoTotal(m);return'<td class="num">'+(t>0?t.toLocaleString():'—')+'</td>';}).join('')+'<td class="num">'+grandTotal.toLocaleString()+'</td></tr>';
  document.getElementById('panel-trips').innerHTML='<div class="stat-row"><div class="stat-card"><div class="stat-label">Total Trips</div><div class="stat-val num">'+grandTotal.toLocaleString()+'</div><div class="stat-sub">Nov 2025 – Jul 2026</div></div><div class="stat-card gold"><div class="stat-label">Top Scheduler</div><div class="stat-val" style="font-size:16px;padding-top:4px">'+topName.split(' ')[0]+'</div><div class="stat-sub">'+tripsTotal(topName).toLocaleString()+' trips</div></div><div class="stat-card green"><div class="stat-label">Staff Contributing</div><div class="stat-val num">'+TRIPS_STAFF.filter(function(n){return tripsTotal(n)>0;}).length+'</div><div class="stat-sub">of '+TRIPS_STAFF.length+' tracked</div></div><div class="stat-card navy"><div class="stat-label">Jul 2026</div><div class="stat-val num">'+tripsMoTotal('Jul 2026')+'</div><div class="stat-sub">Latest complete month</div></div></div><div class="card"><div class="card-title">🚐 Trips Scheduled — Nov 2025 through Jul 2026</div><div style="overflow-x:auto"><table><thead><tr><th class="left">Staff Member</th>'+TRIPS_MONTHS.map(function(m){return'<th>'+m+'</th>';}).join('')+'<th>Total</th></tr></thead><tbody>'+rows+teamRow+'</tbody></table></div></div>';
}

function renderNotes(){
  var html='<div class="perf-grid">'+CORE.map(function(name){
    var ytd=ytdTotal(name),avg=ytdAvgDay(name),notes=PERF_NOTES[name]||{strengths:["Active contributor."],development:["Continue monitoring."],goals:["Maintain current pace."],q3goals:["Maintain current pace."]};
    var bestMo=MONTHS.reduce(function(b,m){return modTotal(m,name)>modTotal(b,name)?m:b;},MONTHS[0]);
    var baseMo=BASELINE_MONTH[name]||"Feb 2026",baseVal=modTotal(baseMo,name),stdBase=STD_DAYS[baseMo]||21,dailyRate=baseVal>0?(baseVal/stdBase).toFixed(1):"—";
    var threshMet=0,threshTotal=0;
    TRACK_MONTHS.forEach(function(mo){if(mo===baseMo||mo===CURRENT_MONTH||TRACK_MONTHS.indexOf(mo)<TRACK_MONTHS.indexOf(baseMo)||!baseVal)return;var t=modTotal(mo,name),ad=getActiveDays(mo,name),stdMo=STD_DAYS[mo]||21,needed=Math.round((baseVal/stdBase)*(ad>0?ad:stdMo)*THRESHOLD);threshTotal++;if(t>=needed)threshMet++;});
    return'<div class="perf-card"><div class="perf-head"><span>'+name+'</span><span style="font-size:11px;font-weight:400;opacity:.7">YTD: '+ytd.toLocaleString()+' claims</span></div><div class="perf-stats"><div class="ps"><div class="ps-val">'+ytd.toLocaleString()+'</div><div class="ps-lbl">YTD Total</div></div><div class="ps"><div class="ps-val">'+avg+'</div><div class="ps-lbl">Avg/Day</div></div><div class="ps"><div class="ps-val" style="font-size:13px">'+bestMo.split(' ')[0]+'</div><div class="ps-lbl">Best Month</div></div><div class="ps"><div class="ps-val">'+modTotal(bestMo,name).toLocaleString()+'</div><div class="ps-lbl">Best Mo Total</div></div><div class="ps"><div class="ps-val">'+dailyRate+'</div><div class="ps-lbl">Base Rate/Day</div></div><div class="ps"><div class="ps-val">'+(threshTotal>0?threshMet+'/'+threshTotal:'—')+'</div><div class="ps-lbl">75% Met</div></div></div><div class="perf-body"><div class="perf-section"><h4>✅ Strengths</h4><ul>'+notes.strengths.map(function(s){return'<li>'+s+'</li>';}).join('')+'</ul></div><div class="perf-section"><h4>⚠️ Development Areas</h4><ul>'+notes.development.map(function(s){return'<li>'+s+'</li>';}).join('')+'</ul></div><div class="perf-section" style="grid-column:1/-1"><h4>🎯 Current Goals</h4><ul>'+notes.goals.map(function(s){return'<li>'+s+'</li>';}).join('')+'</ul></div><div class="perf-section" style="grid-column:1/-1;background:#f0f4f9;border-radius:8px;padding:10px;margin-top:4px"><h4 style="color:var(--navy)">📅 Q3 2026 Goals (Jun–Aug)</h4><ul>'+(notes.q3goals||[]).map(function(s){return'<li>'+s+'</li>';}).join('')+'</ul></div></div></div>';
  }).join('')+'</div>';
  document.getElementById('panel-notes').innerHTML=html;
}

renderSummary();
</script>
</body>
</html>
